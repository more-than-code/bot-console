  <path class="line" d="M716 186 C668 186 660 168 614 168" stroke-width="2" marker-end="url(#arrow)"/>
  <path class="line" d="M716 236 C668 236 660 172 614 172" stroke-width="2" marker-end="url(#arrow)"/>
  <text class="muted" x="664" y="288" font-size="12" text-anchor="middle">Hosts dial out.</text>
  <text class="muted" x="664" y="304" font-size="12" text-anchor="middle">No open ports.</text>

  <!-- Blocked direct path -->
