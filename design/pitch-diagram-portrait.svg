<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 1416" role="img" aria-labelledby="t d" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">How Deploybot lets AI agents run your servers</title>
  <desc id="d">People use the web console in a browser. Any MCP client, such as a coding agent, a chat app or your own script, connects to Deploybot over MCP, signed in as you. Deploybot acts with your project role, runs only what your catalog allows, and asks for a confirm step. Deploybot itself is hosted or self-hosted. Your servers run bot-agent, which dials out to Deploybot, so no ports are open. The agent never gets SSH keys or cloud tokens for the servers. Security: each host has its own allowlist of images and projects, secrets in env sets, files and registry logins are encrypted at rest, and changes are recorded in an audit log. Resilience: deploys wait for health, an unhealthy deploy rolls back to the previous container, one-step rollback to an earlier image digest, a health failure policy per service, and programs run as systemd units that survive reboot. Visibility: host metrics with history, processes and discovered services, health history per service, container logs with secrets redacted, and container logs capped at 10 MB times 3. Teams: owner, admin and viewer roles per project, invite links that expire and are single-use by default, per-entry rights to run, stop, restart or deploy, a host shared with other projects at metrics or deploy level, and one-time join tokens for adding hosts.</desc>
