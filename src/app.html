<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="light dark" />
		<meta name="robots" content="noindex" />
		<link rel="icon" href="%sveltekit.assets%/brand/favicon.svg" type="image/svg+xml" />
		<link rel="icon" href="%sveltekit.assets%/brand/favicon-32.png" sizes="32x32" type="image/png" />
		<link rel="icon" href="%sveltekit.assets%/brand/favicon-16.png" sizes="16x16" type="image/png" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/brand/apple-touch-icon.png" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f8fafd" />
		<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f1419" />
		<script nonce="%sveltekit.nonce%">
			(function () {
				var root = document.documentElement;
				var media = window.matchMedia('(prefers-color-scheme: dark)');
				function apply() {
					if (root.getAttribute('data-theme') === 'system') {
						root.classList.toggle('dark', media.matches);
					}
				}
				apply();
				media.addEventListener('change', apply);
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
